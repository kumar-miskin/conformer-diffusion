name: tests and saved-result audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]' numpy==2.5.4 rdkit==2026.9.2
      - run: pytest -q
      - run: python scripts/verify_results.py
      - run: python scripts/verify_resume.py
